# Mosquitto MQTT Broker configuration for SmartElectric
# Place in /etc/mosquitto/mosquitto.conf or /etc/mosquitto/conf.d/

# Listen on default port 1883 on all network interfaces
listener 1883 0.0.0.0

# Allow anonymous connections for local Wi-Fi devices (ESP32 and Jetson backend)
# In production, configure username/password files or TLS certificates
allow_anonymous true

# Enable persistence
persistence true
persistence_location /var/lib/mosquitto/

# Log configuration
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout

# Log connection states and subscription details for troubleshooting
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
